[package]
name = "fastsecdec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native Rust Feynman-parameter generation and numerical sector integration"

[features]
default = ["native"]
native = [
    "symbolica/integer-gmp", "symbolica/float-mpfr", "symbolica/native_code_generation",
    "numerica/integer-gmp", "numerica/float-mpfr", "dep:symjit", "fastsecdec-sectors/native",
    "fastsecdec-qmc/native",
]
portable = [
    "symbolica/wasm", "numerica/integer-malachite", "numerica/float-astro",
    "fastsecdec-sectors/portable", "fastsecdec-qmc/portable", "feynkit-graph/wasm", "feynkit-kinematics/wasm",
    "linnet/wasm", "idenso/wasm", "spenso/wasm",
]

[dependencies]
fastsecdec-sectors.workspace = true
fastsecdec-qmc = { workspace = true, features = ["serde"] }
symbolica.workspace = true
numerica.workspace = true
symjit = { workspace = true, optional = true }
feynkit-graph.workspace = true
feynkit-model.workspace = true
feynkit-kinematics.workspace = true
linnet.workspace = true
idenso.workspace = true
spenso.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
thiserror.workspace = true
bincode.workspace = true
rand = "0.9"

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
feynkit-generator = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-tensor.workspace = true
# Same native scalar-master provider/revision as the HEPKit community bridge.
oneloop = { git = "https://github.com/alphal00p/oneloopmaster", branch = "main", default-features = false }
one-loop-reduce = { git = "https://github.com/lcnbr/one-loop-reduce", branch = "main", default-features = false }

[[example]]
name = "gghh_double_box"
path = "examples/gghh_double_box/main.rs"

[[example]]
name = "gghh_double_box_400"
path = "../../examples/contour/gghh_double_box_400/prepare.rs"
required-features = ["native"]

[[example]]
name = "contour_scalar_benchmark"
path = "examples/contour_scalar_benchmark.rs"
required-features = ["native"]

[[example]]
name = "contour_cap_study"
path = "examples/contour_cap_study.rs"
required-features = ["native"]
