# Runtime overlay: Havana sector/coordinate importance sampling, targeting 1%.
[integration]
method = "discrete_mc"
workers = 8
seed = 20261008
points = 32768         # Production points per batch, across all sectors.
shifts = 32           # Independent production batches; grids stay frozen.
max_rounds = 8        # Refinement rounds, separate from pilot iterations.
evaluation_batch_size = 256 # Evaluator/SIMD chunk size, not a statistical count.
accuracy_target = { target = "laurent_order", order = 0 }
relative_tolerance = 0.01
absolute_tolerance = 0.0

[integration.discrete_mc]
pilot_points = 4096
pilot_batches = 8     # Update grids after 4096 * 8 = 32768 global samples.
pilot_iterations = 3  # Three grid updates, then freeze for production.
discrete_learning_rate = 0.5
continuous_learning_rate = 0.5
# Pilot samples train both grids; they are excluded from the production estimate.
# Each refinement round restarts training and doubles production points/batch.
# Havana does not use the QMC Korobov periodization setting.
