# Explicit scalar density; no topology-derived measure or prefactor is implied.
[direct]
domain = "positive_orthant"
parameters = ["x1", "x2", "x3", "x4", "x5", "x6", "x7", "x8", "x9"]

[[direct.terms]]
prefactor = "1"

[[direct.terms.factors]]
polynomial_file = "../parametric/four_loop_hard_u.sym"
exponent = "1"
role = "singularity"

[[direct.terms.factors]]
polynomial_file = "../parametric/four_loop_hard_f.sym"
exponent = "eps-3"
role = "singularity"

[integral]
regulator = "eps"

[generation]
order = 0
