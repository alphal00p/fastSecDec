# Native HEPKit P(index) scalar products; paths are relative to this card.
# Nonzero dot products and contributing model inputs are evaluator parameters.
# The integration defaults below select the historical Euclidean reference point.
# Reproduces the historical explicit propagators: the second outgoing leg
# has virtuality 2*s. See ../README.md for the legacy annotation inconsistency.
[input]
graph = "../graphs/triangle_numerator.dot"
model = "../models/scalar.json"
parameter_card = "../models/massless.json"

[kinematics]
products = [
  { left = 0, right = 0, symbol = "p0_dot_p0" },
  { left = 1, right = 1, value = "0" },
  { left = 0, right = 1, symbol = "p0_dot_p1" },
]

# This massless family is a structural specialization.
[parameters]
"UFO::mt" = "0"

[integral]
dimension = "4-2*eps"
regulator = "eps"
measure_multiplier = "1"

[generation]
order = 0

[integration.parameters]
"p0_dot_p0" = -1.0
"p0_dot_p1" = 0.5
