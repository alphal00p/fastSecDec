# Native HEPKit P(index) scalar products; paths are relative to this card.
[input]
graph = "../graphs/triple_box_offshell_rank2_numerator.dot"
model = "../models/scalar.json"
parameter_card = "../models/massless.json"

[kinematics]
products = [
  { left = 0, right = 0, value = "mext2" },
  { left = 1, right = 1, value = "mext2" },
  { left = 2, right = 2, value = "mext2" },
  { left = 0, right = 1, value = "(s12-2*mext2)/2" },
  { left = 1, right = 2, value = "(s23-2*mext2)/2" },
  { left = 0, right = 2, value = "(2*mext2-s12-s23)/2" },
]

[parameters]
mext2 = "-1"
s12 = "-2"
s23 = "-2"

[integral]
dimension = "4-2*eps"
regulator = "eps"
measure_multiplier = "1"

[generation]
order = 0
assume_no_threshold = false
