# Analytic control: eps^-1 integral_0^1 [1-5*x*(1-x)-i0]^-eps dx.
# The finite part is 2-beta*log((1+beta)/(1-beta))+i*pi*beta,
# beta=sqrt(1/5). The pole coefficient is 1.
[direct]
domain = "unit_cube"
parameters = ["x"]

[[direct.terms]]
prefactor = "1/eps"
monomial_powers = ["0"]

[[direct.terms.factors]]
polynomial = "1-5*x*(1-x)"
exponent = "-eps"
semantics = "causal"

[generation]
order = 0
contour = true

[integration]
points = 4096
shifts = 16
workers = 1
periodization = "korobov3"
relative_tolerance = 0.001
accuracy_target = { target = "laurent_order", order = 0 }

[integration.contour.deformation]
mode = "fixed"
lambda = 0.2
