[workspace]
members = ["crates/fastsecdec", "crates/fastsecdec-sectors", "crates/fastsecdec-qmc", "crates/fastsecdec-cli"]
exclude = ["DO_NOT_PUSH_FOR_REFERENCE_ONLY", "output", "tests/portable-kernel", "bindings/python"]
default-members = ["crates/fastsecdec-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
fastsecdec = { path = "crates/fastsecdec", default-features = false }
fastsecdec-sectors = { path = "crates/fastsecdec-sectors", default-features = false }
fastsecdec-qmc = { path = "crates/fastsecdec-qmc", default-features = false }
symbolica = { version = "3.0.1", default-features = false, features = ["serde", "bincode"] }
numerica = { version = "3.0.1", default-features = false, features = ["serde", "bincode"] }
# Use the published Rust library with a compatible 2.x minimum, not its C/Python cdylib.
symjit = "2.26.4"
feynkit-graph = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-model = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
feynkit-tensor = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
linnet = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false, features = ["serde", "bincode", "nodestore-vec"] }
idenso = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false }
spenso = { git = "https://github.com/alphal00p/gammaloop", branch = "feynkit", default-features = false, features = ["shadowing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
thiserror = "2.0"
toml = "0.9"
clap = { version = "4.6", features = ["derive"] }
rayon = "1.11"
tempfile = "3"
blake3 = "1.8"
bincode = { version = "2.0.1", features = ["serde"] }

[patch.crates-io]
symbolica = { git = "https://github.com/ValentinHirschi/symbolica", rev = "1deccb8538ccb91dc2c1e58fc0a2e900d2276bf4" }
# Match HEPKit's optional Spenso Wasm dependency source; no plugin feature is selected.
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }

[profile.dev.package.symbolica]
opt-level = 2

[profile.dev.package.numerica]
opt-level = 2

[profile.release]
lto = "thin"
