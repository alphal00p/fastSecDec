# Generated by the native gghh_one_loop_me example.
# One term in the complete top-loop amplitude; delta_ab/8 projection, incoming (+,+) helicities.
[input]
graph = "graph.dot"
model = "model.json"
parameter_card = "parameters.json"

[kinematics]
# Exact incoming-gluon on-shell conditions, applied before sector finding.
auxiliary_momenta = ["gghh::{spenso::tensor,spenso::rank1}::eps1","gghh::{spenso::tensor,spenso::rank1}::eps2"]
products = [
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(0)", right = "gammalooprs::{spenso::rank1,spenso::tensor}::P(0)", value = "0" },
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(0)", right = "gammalooprs::{spenso::rank1,spenso::tensor}::P(1)", symbol = "p0p1" },
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(0)", right = "gammalooprs::{spenso::rank1,spenso::tensor}::P(2)", symbol = "p0p2" },
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(0)", right = "gghh::{spenso::tensor,spenso::rank1}::eps1", symbol = "p0eps1" },
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(0)", right = "gghh::{spenso::tensor,spenso::rank1}::eps2", symbol = "p0eps2" },
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(1)", right = "gammalooprs::{spenso::rank1,spenso::tensor}::P(1)", value = "0" },
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(1)", right = "gammalooprs::{spenso::rank1,spenso::tensor}::P(2)", symbol = "p1p2" },
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(1)", right = "gghh::{spenso::tensor,spenso::rank1}::eps1", symbol = "p1eps1" },
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(1)", right = "gghh::{spenso::tensor,spenso::rank1}::eps2", symbol = "p1eps2" },
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(2)", right = "gammalooprs::{spenso::rank1,spenso::tensor}::P(2)", symbol = "p2p2" },
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(2)", right = "gghh::{spenso::tensor,spenso::rank1}::eps1", symbol = "p2eps1" },
  { left = "gammalooprs::{spenso::rank1,spenso::tensor}::P(2)", right = "gghh::{spenso::tensor,spenso::rank1}::eps2", symbol = "p2eps2" },
  { left = "gghh::{spenso::tensor,spenso::rank1}::eps1", right = "gghh::{spenso::tensor,spenso::rank1}::eps1", symbol = "eps1eps1" },
  { left = "gghh::{spenso::tensor,spenso::rank1}::eps1", right = "gghh::{spenso::tensor,spenso::rank1}::eps2", symbol = "eps1eps2" },
  { left = "gghh::{spenso::tensor,spenso::rank1}::eps2", right = "gghh::{spenso::tensor,spenso::rank1}::eps2", symbol = "eps2eps2" },
]

[integral]
dimension = "4-2*eps"
regulator = "eps"
measure_multiplier = "gamma(1-2*eps)/(gamma(1+eps)*gamma(1-eps)^2)"

[generation]
order = 0

[generation.coefficient_expansion]
method = "coefficient_series"

# Extract the native loop-independent Higgs propagator exactly once.
[generation.family_preparation.SingleTerm]
max_states = 32
